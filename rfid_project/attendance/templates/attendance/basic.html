{% load static %}
<!doctype html>
<html lang="de">
<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1, user-scalable=no">

	<!-- Bootstrap CSS (vendored locally — no runtime CDN dependency) -->
	<link rel="stylesheet" href="{% static 'attendance/vendor/bootstrap.min.css' %}">

	<!-- Kiosk theme: dark, high-contrast, touch-friendly (overrides Bootstrap) -->
	<link rel="stylesheet" href="{% static 'attendance/kiosk.css' %}">
	{% block extra_head %}{% endblock %}

	<title>{% block title %}{% endblock %}</title>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-dark">
	<a class="navbar-brand" href="/home">Presency</a>
	<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
			aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
		<span class="navbar-toggler-icon"></span>
	</button>

	<div class="collapse navbar-collapse" id="navbarSupportedContent">
		<ul class="navbar-nav mr-auto">
			<li class="nav-item active">
				<a class="nav-link" href="/home">Home<span class="sr-only">(current)</span></a>
			</li>
			<!-- <li class="nav-item active">
				<a class="nav-link" href="/users">Nutzer</a>
			</li> -->
			<li class="nav-item active">
				<a class="nav-link" href="/manage">Nutzer verwalten</a>
			</li>
			<!-- <li class="nav-item dropdown">
				<a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown"
				   aria-haspopup="true" aria-expanded="false">
					Developer
				</a>
				<div class="dropdown-menu" aria-labelledby="navbarDropdown">
					<a class="dropdown-item" href="https://github.com/shubhamkumar27">GitHub Profile</a>
					<a class="dropdown-item" href="https://www.linkedin.com/in/shubham-kumar-7b539b151/">LinkedIn
						Profile</a>
				</div>
			</li> -->
		</ul>
		<form class="form-inline my-2 my-lg-0 ml-auto" action="/searchuser/" method="get" role="search">
			<input class="form-control mr-sm-2" name="search" type="search" placeholder="Nutzer suchen"
				   aria-label="Nutzer suchen">
			<button class="btn btn-outline-success my-2 my-sm-0" type="submit">Suchen</button>
		</form>
	</div>
</nav>
<div class="kiosk-wake-hint">Berühren zum Aufwachen</div>
{% block body %}{% endblock %}
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS (all vendored locally) -->
<script src="{% static 'attendance/vendor/jquery-3.3.1.min.js' %}"></script>
<script src="{% static 'attendance/vendor/popper.min.js' %}"></script>
<script src="{% static 'attendance/vendor/bootstrap.min.js' %}"></script>
<script src="{% static 'attendance/kiosk.js' %}"></script>
<script>$('.toast').toast('show')</script>
{% block js %}{% endblock %}
</body>
</html>
