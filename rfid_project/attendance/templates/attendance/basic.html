{% load static %}
<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1, user-scalable=no">
	<meta name="theme-color" content="#0e1116">
	<link rel="stylesheet" href="{% static 'attendance/vendor/bootstrap.min.css' %}">
	<link rel="stylesheet" href="{% static 'attendance/kiosk.css' %}?v=2">
	<link rel="stylesheet" href="{% static 'attendance/virtual-keyboard.css' %}?v=2">
	{% block extra_head %}{% endblock %}
	<title>{% block title %}Presency{% endblock %}</title>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-dark" aria-label="Hauptnavigation">
	<a class="navbar-brand" href="/home" aria-label="Presency Home">
		<span class="brand-dot" aria-hidden="true"></span>Presency
	</a>
	<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
			aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Menü öffnen">
		<span class="navbar-toggler-icon"></span>
	</button>
	<div class="collapse navbar-collapse" id="navbarSupportedContent">
		<ul class="navbar-nav ml-auto">
			<li class="nav-item{% if request.path == '/' or request.path == '/home' or request.path == '/home/' %} active{% endif %}">
				<a class="nav-link" href="/home"{% if request.path == '/' or request.path == '/home' or request.path == '/home/' %} aria-current="page"{% endif %}>Home</a>
			</li>
			<li class="nav-item{% if request.path|slice:':7' == '/manage' %} active{% endif %}">
				<a class="nav-link" href="/manage"{% if request.path|slice:':7' == '/manage' %} aria-current="page"{% endif %}>Nutzer verwalten</a>
			</li>
			<li class="nav-item{% if request.path|slice:':6' == '/alarm' %} active{% endif %}">
				<a class="nav-link" href="/alarm/"{% if request.path|slice:':6' == '/alarm' %} aria-current="page"{% endif %}>Alarm</a>
			</li>
		</ul>
	</div>
</nav>
<div class="kiosk-wake-hint" role="status" aria-live="polite">Berühren zum Aufwachen</div>
<main class="kiosk-main">
{% block body %}{% endblock %}
</main>
<script src="{% static 'attendance/vendor/jquery-3.3.1.min.js' %}"></script>
<script src="{% static 'attendance/vendor/popper.min.js' %}"></script>
<script src="{% static 'attendance/vendor/bootstrap.min.js' %}"></script>
<script src="{% static 'attendance/kiosk.js' %}"></script>
<script src="{% static 'attendance/virtual-keyboard.js' %}"></script>
<script>$('.toast').toast('show')</script>
{% block js %}{% endblock %}
</body>
</html>
