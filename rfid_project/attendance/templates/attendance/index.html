{% extends 'attendance/basic.html' %}

{% block title %}Anwesend{% endblock %}

{% block body %}

<div class="container-fluid text-center">
  <br>
  <div id="clock-header" class="kiosk-clock" aria-live="off">
    <div id="clock-time" class="clock-time"></div>
    <div id="clock-date" class="clock-date"></div>
  </div>
  <br>
  <div id="empty-state" class="kiosk-empty" hidden>
    <p>Niemand anwesend</p>
  </div>
  <table class="table" id="cards-table">
    <thead class="thead-light">
      <TR>
        <!-- <TH>ID.No</TH> -->
        <TH>Name</TH>
        <!-- <TH>RFID</TH> -->
        <!-- <TH>Phone Number</TH> -->
        <TH>Datum</TH>
        <TH class="text-center" title="Löschen">Löschen</TH>
        <!-- <TH>Zeit Out</TH> -->
      </TR>
    </thead>
    <tbody id="cards" class="cards">
    </tbody>
  </table>
</div>
{% endblock %}
{% block js %}
<script>
  $(document).ready(function () {
    var PRESENT_URL = "{% url 'present' %}";
    var PROCESS_URL = "{% url 'process' %}";

    // Live clock + German date header, updated every second
    function updateClock() {
      var now = new Date();
      $('#clock-time').text(now.toLocaleTimeString('de-DE', { hour12: false }));
      $('#clock-date').text(now.toLocaleDateString('de-DE', {
        weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric'
      }));
    }
    updateClock();
    setInterval(updateClock, 1000);

    // JSON polling of the present list every 10 seconds
    function loadPresent() {
      $.ajax({
        url: PRESENT_URL,
        dataType: 'json'
      }).done(function (data) {
        var rows = data || [];
        var $cards = $('#cards').empty();
        if (!rows.length) {
          $('#empty-state').prop('hidden', false);
          $('#cards-table').prop('hidden', true);
          return;
        }
        $('#empty-state').prop('hidden', true);
        $('#cards-table').prop('hidden', false);
        $.each(rows, function (i, entry) {
          var name = entry.name != null ? entry.name : '';
          var $tr = $('<tr>');
          $('<td>').text(name).appendTo($tr);
          $('<td>').text(entry.date).appendTo($tr);
          var $td = $('<td class="text-center">');
          $('<button>')
            .attr('type', 'button')
            .attr('title', 'Löschen')
            .attr('aria-label', 'Löschen')
            .addClass('btn btn-sm btn-danger delete-btn')
            .data('card', entry.card_id)
            .append(trashSvg())
            .appendTo($td);
          $td.appendTo($tr);
          $tr.appendTo($cards);
        });
      });
    }
    loadPresent();
    setInterval(loadPresent, 10000);

    function trashSvg() {
      var ns = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width', '24');
      svg.setAttribute('height', '24');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '2');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      svg.setAttribute('aria-hidden', 'true');
      var polyline = document.createElementNS(ns, 'polyline');
      polyline.setAttribute('points', '3 6 5 6 21 6');
      var path1 = document.createElementNS(ns, 'path');
      path1.setAttribute('d', 'M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6');
      var path2 = document.createElementNS(ns, 'path');
      path2.setAttribute('d', 'M10 11v6');
      var path3 = document.createElementNS(ns, 'path');
      path3.setAttribute('d', 'M14 11v6');
      var path4 = document.createElementNS(ns, 'path');
      path4.setAttribute('d', 'M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2');
      svg.appendChild(polyline);
      svg.appendChild(path1);
      svg.appendChild(path2);
      svg.appendChild(path3);
      svg.appendChild(path4);
      return svg;
    }

    function deleteEntry(cardId, btn) {
      $.ajax({
        url: PROCESS_URL,
        data: { card_id: cardId, delete: 1 },
        method: 'GET'
      }).done(function (resp) {
        $(btn).closest('tr').remove();
        loadPresent();
      }).fail(function () {
        alert('Löschen fehlgeschlagen');
      });
    }

    // Two-tap delete: first tap arms the button ("Sicher?"), second tap within
    // 3s confirms; tapping elsewhere or waiting 3s disarms.
    var ARM_TIMEOUT_MS = 3000;
    var armTimers = {};

    function disarm(btn) {
      var $btn = $(btn);
      $btn.removeClass('armed').html(trashSvg()).attr('aria-label', 'Löschen').attr('title', 'Löschen');
      if (armTimers[$btn.data('card')]) {
        clearTimeout(armTimers[$btn.data('card')]);
        delete armTimers[$btn.data('card')];
      }
    }

    function arm(btn) {
      var $btn = $(btn);
      var cardId = $btn.data('card');
      disarm(btn);
      $btn.addClass('armed').text('Sicher?').attr('aria-label', 'Sicher löschen?').attr('title', 'Erneut tippen zum Löschen');
      armTimers[cardId] = setTimeout(function () {
        disarm(btn);
        delete armTimers[cardId];
      }, ARM_TIMEOUT_MS);
    }

    // Cancel arming when tapping anywhere else
    $(document).on('pointerdown touchstart', function (e) {
      var $btn = $(e.target).closest('.delete-btn');
      if (!$btn.length) {
        $('.delete-btn.armed').each(function () { disarm(this); });
      }
    });

    // Delegated handler for delete buttons inside the dynamically loaded table
    $(document).on('click', '.delete-btn', function (e) {
      e.stopPropagation();
      var $btn = $(this);
      if ($btn.hasClass('armed')) {
        var cardId = $btn.data('card');
        disarm(this);
        deleteEntry(cardId, this);
      } else {
        arm(this);
      }
    });
  });
  </script>
{% endblock %}
