# Protocol:
# The device streams the raw hyphenated RFID UID (e.g., "74-10-37-94")
# followed by a newline ("\n") over UART0-TX (GPIO1) at 115200 baud.
# No Wi-Fi, HTTP, or API components are used.

substitutions:
  name: nfc-reader
  friendly_name: nfc-reader

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -10
    then:
    - rtttl.play: "success:d=24,o=5,b=100:c,g,b"
    - light.turn_on:
        id: activity_led
        brightness: 100%
        red: 0%
        green: 0%
        blue: 100%
        flash_length: 500ms

esp8266:
  board: d1_mini

uart:
  id: uart_bus
  baud_rate: 115200
  tx_pin: GPIO1

# Enable logging on UART1 so UART0 (GPIO1) stays free for UID streaming
logger:
  baud_rate: 115200
  hardware_uart: UART1
  level: INFO

i2c:
  scan: False
  frequency: 400kHz

pn532_i2c:
  id: pn532_board
  on_tag:
    then:
    - light.turn_on:
        id: activity_led
        brightness: 100%
        red: 0%
        green: 100%
        blue: 0%
        flash_length: 500ms
    - rtttl.play: "beep:d=8,o=6,b=100:b5"
    - lambda: |-
        id(uart_bus).write_str(x.c_str());
        id(uart_bus).write_str("\n");

# Define the buzzer output
output:
- platform: esp8266_pwm
  pin: D7
  id: buzzer

# Define buzzer as output for RTTTL
rtttl:
  output: buzzer

# Configure LED
light:
- platform: neopixelbus
  variant: WS2812
  pin: RX
  num_leds: 1
  flash_transition_length: 500ms
  type: GRB
  id: activity_led
  name: "${friendly_name} LED"
  restore_mode: ALWAYS_OFF

